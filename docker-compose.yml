# Local development stack: the API, its PostgreSQL database, and Seq for searching the API's logs.
#   cp .env.example .env     (then set the passwords and JWT_SECRET_KEY)
#   docker compose up --build
services:
  # Applies the database migrations, once, then exits. Migrations are never run when the API starts: a request-serving process
  # must not hold the power to change the schema, and two API instances starting together must not race to migrate.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      # The migrator role owns the schema (see docker/postgres/init/01-roles.sh); the API's role cannot change it.
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=grocerease_migrator;Password=${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # The API connects as the least-privilege "grocerease_app" role (see docker/postgres/init/01-roles.sh), never as the
      # superuser: it can read and write rows, and cannot create, alter or drop anything.
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=grocerease_app;Password=${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      # Becomes the Jwt:SecretKey setting ("__" is how an environment variable names a nested key). The API refuses
      # to start if it is missing or shorter than 32 characters. It lives in .env, never in a committed file.
      Jwt__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      # Logs go to the console ("docker compose logs api") and to Seq. The image writes no log files (see its Dockerfile). Seq is not in
      # depends_on on purpose: logging must never be a reason for the API not to start, and the API keeps answering if Seq is stopped.
      # Seq only receives what is sent while it is up; the console output is what Docker kept meanwhile.
      Seq__ServerUrl: http://seq:5341
    depends_on:
      db:
        condition: service_healthy
      # Wait until the schema is up to date: the migrate service must have run and finished without error.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Asks the API's own /health (readiness, which includes the database). The runtime image has no curl or wget, and adding one
      # would grow the image, so bash opens the connection and sends the request by hand. Docker only reports the result in
      # "docker compose ps"; nothing restarts the container because of it.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # The image already runs as the non-root "app" user; these two limit what it could do anyway.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Seq: search and filter the API's structured logs at http://localhost:5341 (see "Logging" in the README).
  # LOCAL DEVELOPMENT ONLY. It has no login (SEQ_FIRSTRUN_NOAUTHENTICATION: Seq will not start without either that or an admin
  # password), so it listens on this machine only, like the database, and anyone who can reach the port can read every log.
  # For anything shared, drop that variable and set SEQ_FIRSTRUN_ADMINPASSWORDHASH instead (README), and give the API a key (Seq__ApiKey).
  seq:
    image: datalust/seq:2026.1
    environment:
      # Seq's license agreement, which the image requires to be accepted before it starts. Free for individual use.
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # Loopback only. The UI and the ingestion API are both on container port 80; the API reaches ingestion on 5341 inside the network.
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data
    # The image runs as root, and does not start with its capabilities dropped (tried: "Operation not permitted"), so unlike the
    # other services this is the one hardening that fits.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db:
    image: postgres:18
    # Run as the image's "postgres" user from the start instead of starting as root and
    # dropping privileges. The named volume below takes its ownership from the image.
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by docker/postgres/init/01-roles.sh, which creates the two application roles on first start.
      MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD in .env}
      APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    ports:
      # Loopback only, so tools on this machine can connect but the network cannot.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a version folder below /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      # Scripts here run once, when the data volume is first created. They do not run again on an existing volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db-data:
  seq-data:
