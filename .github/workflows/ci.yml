name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the SDK that global.json pins, so CI builds with the same SDK as your machine.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      # Warnings are errors (Directory.Build.props), so this step is also the analyzer gate.
      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release

  docker:
    name: Docker image and Compose file
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Build only, nothing is pushed. Catches a Dockerfile that no longer builds.
      - run: docker build --tag grocerease-api:ci .

      # The migration runner image: builds the EF migration bundle, so a migration that does not compile fails here too.
      - run: docker build --target migrate --tag grocerease-migrate:ci .

      # Catches a Compose file that no longer parses. .env.example supplies the required variables.
      - run: docker compose --env-file .env.example config --quiet

      # No container may run as root. The API and migrate images take their user from the base image ("USER $APP_UID");
      # the database takes it from "user: postgres" in docker-compose.yml.
      - name: Containers do not run as root
        run: |
          docker compose --env-file .env.example config --format json | jq -e '.services.db.user == "postgres"'
          for image in grocerease-api:ci grocerease-migrate:ci; do
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            echo "$image user: '$user'"
            test -n "$user" && test "$user" != "0" && test "$user" != "root"
          done

      # Seq has no login in this stack, so it must never be reachable from the network: every published port is on 127.0.0.1.
      - name: Seq is published on the loopback address only
        run: |
          docker compose --env-file .env.example config --format json | jq -e '.services.seq.ports | length > 0 and all(.host_ip == "127.0.0.1")'

      # Starts the real stack (database, migrations, API) with throwaway passwords and checks it over HTTP and in the database.
      # The same script anyone can run locally: ./scripts/smoke-test.sh
      - name: Smoke test the whole stack
        run: ./scripts/smoke-test.sh
